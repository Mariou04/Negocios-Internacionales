function negCam(){
  const a=innerWidth/innerHeight;
  const cx=(BOG[0]+CHI[0])/2*K;
  const cy=(-Y(BOG[1])+-Y(CHI[1]))/2;
  const spanX=Math.abs(CHI[0]-BOG[0])*K+38;
  const spanY=Math.abs(Y(CHI[1])-Y(BOG[1]))+28;
  const h=Math.max(spanY,spanX/a);
  return {cx,cy,h};
}

function ngStart(){
  const s=ngSt;
  if(!s||(s.mode!=='intro'&&s.mode!=='wait'))return;
  s.mode='choose';
  const k=$('#ngK');if(k)k.classList.add('off');
  const st=$('#ngStage');if(st)st.classList.add('on');
}

function ngClose(){
  const a=$('#ngA'),x=$('#ngX'),an=$('#ngAn');
  if(a)a.classList.remove('on');
  if(x)x.classList.remove('on');
  if(an)an.classList.remove('talk');
}

function ngToChoose(markRejected){
  const s=ngSt;
  if(!s)return;
  if(markRejected!==undefined&&markRejected){
    const btns=$$('.ngOpt');
    if(btns[s.cur]){
      btns[s.cur].classList.add('rejected');
      if(!btns[s.cur].querySelector('.no-tag')){
        const tg=document.createElement('span');
        tg.className='no-tag';
        tg.textContent='✕ No aceptado';
        btns[s.cur].appendChild(tg);
      }
    }
  }
  ngClose();
  s.mode='choose';
}

function ngShow(){
  const s=ngSt;if(!s)return;
  const n=NEG[s.cur];
  $$('#ngR .ngS').forEach((e,j)=>{
    e.classList.toggle('on',j===s.k);
    e.classList.toggle('dn',j<s.k);
  });
  const e=$('#ngE');
  if(e){
    e.classList.remove('in');
    void e.offsetWidth;
    e.textContent=n.es[s.k];
    e.classList.add('in');
  }
  const c=$('#ngC');
  if(c)c.textContent=(s.k+1)+' / '+n.ro.length;
}

function ngPick(i){
  const s=ngSt;
  if(!s||(s.mode!=='choose'&&s.mode!=='read'))return;
  s.mode='read';
  s.cur=i;
  s.k=0;
  const n=NEG[i];
  
  const al=$('#ngAL');
  if(al)al.textContent='ANDREI · RO — OFERTA: '+n.t.toUpperCase();
  
  const nr=$('#ngR');
  if(nr)nr.innerHTML=n.ro.map(t=>`<span class="ngS">${t}</span>`).join(' ');
  
  const a=$('#ngA'),x=$('#ngX'),an=$('#ngAn');
  if(a)a.classList.add('on');
  if(x)x.classList.add('on');
  if(an)an.classList.add('talk');
  
  ngShow();
}

function ngFinal(){
  const s=ngSt;if(!s)return;
  s.mode='end';
  ngClose();
  const st=$('#ngStage');if(st)st.classList.remove('on');
  
  $('#ov').append(ngEl(`
    <div id="ngF">
      <div class="ngF-badges">💎 🇲🇩 🤝 🇨🇴</div>
      <h3>„Tranzacția s-a încheiat, mulțumesc.”</h3>
      <p class="ngF-sub">¡Trato cerrado con éxito! Moldavia acuerda negociar la compra de esmeraldas colombianas certificadas.</p>
      <div class="ngF-desc">La confianza personal, el respeto por las costumbres en la mesa y ofrecer un producto de alto valor y diferenciación abrieron las puertas de este mercado.</div>
      <button class="ngBtn" id="ngH" style="width:auto;padding:14px 34px;pointer-events:auto">Volver al inicio ↺</button>
    </div>
  `));
  
  const hBtn=$('#ngH');
  if(hBtn)hBtn.onclick=()=>goHome();
  const t=tok;
  setTimeout(()=>{if(ngSt===s&&tok===t)goHome()},12000);
}

function ngStep(dir){
  const s=ngSt;if(!s||s.mode!=='read')return;
  const n=NEG[s.cur];
  if(dir>0){
    if(s.k<n.ro.length-1){
      s.k++;
      ngShow();
    }else{
      if(n.ok)ngFinal();
      else ngToChoose(true);
    }
  }else{
    if(s.k>0){
      s.k--;
      ngShow();
    }else{
      ngToChoose(false);
    }
  }
}

function ngNext(){
  const s=ngSt;if(!s)return;
  if(s.mode==='intro'||s.mode==='wait')ngStart();
  else if(s.mode==='read')ngStep(1);
  else if(s.mode==='end')goHome();
}

function ngPrev(){
  const s=ngSt;if(!s)return;
  if(s.mode==='read')ngStep(-1);
  else if(s.mode==='end')goHome();
}

if(!window.__ngK){
  window.__ngK=1;
  addEventListener('keydown',e=>{
    if(!ngMe())return;
    const k=e.key;
    const nx=['ArrowRight','ArrowDown','PageDown',' ','Enter'].includes(k);
    const pv=['ArrowLeft','ArrowUp','PageUp'].includes(k);
    const dg=/^[1-4]$/.test(k);
    
    if(!nx&&!pv&&!dg)return;
    const m=ngSt.mode;
    
    if(m==='intro'||m==='wait'){
      if(nx){e.preventDefault();e.stopPropagation();ngStart()}
      return;
    }
    if(m==='choose'){
      if(dg){e.preventDefault();e.stopPropagation();ngPick(+k-1)}
      else if(pv){e.preventDefault();e.stopPropagation();go(idx-1)}
      return;
    }
    if(m==='read'){
      e.preventDefault();e.stopPropagation();
      if(dg)ngPick(+k-1);
      else if(nx)ngStep(1);
      else if(pv)ngStep(-1);
      return;
    }
    if(m==='end'){
      if(nx||pv){e.preventDefault();e.stopPropagation();goHome()}
    }
  },true);

  document.addEventListener('click',e=>{
    const b=e.target.closest&&e.target.closest('#prev,#next');
    if(!b||!ngMe())return;
    const m=ngSt.mode;
    if(b.id==='prev'){
      if(m==='read'){e.preventDefault();e.stopPropagation();ngStep(-1)}
      else if(m==='intro'||m==='choose'){/* allow regular prev to go to scene 12 */}
    }else if(b.id==='next'){
      if(m==='intro'||m==='wait'){e.preventDefault();e.stopPropagation();ngStart()}
      else if(m==='read'){e.preventDefault();e.stopPropagation();ngStep(1)}
      else if(m==='end'){e.preventDefault();e.stopPropagation();goHome()}
    }
  },true);
}

  const mMd=mk({lon:CHI[0],lat:CHI[1],dot:'#1d4ea8',r:5,pulse:1,text:'Moldavia (Chișinău)',cls:'w',dy:-12,an:'middle'});
  
  // Arco geodésico
  const a=arc(BOG,CHI,-.16);
  const l=ln('#1d4ea8','8 6');
  l.style.strokeWidth='2.6px';
  const dk=mk({lon:a.mid[0],lat:a.mid[1],text:'≈ '+fmtN(hav(BOG,CHI))+' km',cls:'s',pill:1,b:1,dx:0,an:'middle'});
  
  // Transición suave de cámara hacia vista global centrada
  await camTo(negCam(),2800);
  on(mCo,mMd);
  await sleep(600);
  
  on(l);
  await tw(2000,t=>l.setAttribute('d',a.draw(t)));
  on(dk);
  
  // Animación del trayecto de vuelo
  const u=cam.h/innerHeight,g=el('g',{},D1);
  el('circle',{r:8*u,fill:'#1d4ea8',opacity:.25},g);
  el('circle',{r:3.5*u,fill:'#f2b705'},g);
  el('animateMotion',{dur:'4.5s',repeatCount:'indefinite',path:a.draw(1)},g);
  await sleep(700);

  // DESENFOCAR FONDO Y CENTRAR EN PERSONAJES Y NEGOCIACIÓN
  map.classList.add('blur');

  // Interfaz de negociación
  $('#ov').append(
    ngEl(`
      <div id="ngK">
        <span class="ngBadge">MOLDAVIA 🇲🇩 · CULTURA COMERCIAL</span>
        <h3>Estás a punto de negociar con <span>Andrei</span></h3>
        <div class="rc">RECUERDA EL PROTOCOLO:</div>
        <ul>
          <li><span class="lic">🍷</span><div><b>En la mesa, no en oficinas:</b> Los negocios no se cierran en salas frías, se consolidan comiendo y compartiendo vino local.</div></li>
          <li><span class="lic">🤝</span><div><b>Relación antes que contrato:</b> Para el moldavo, la confianza en la persona está por encima de cualquier propuesta en papel.</div></li>
          <li><span class="lic">🍽️</span><div><b>Cortesía y respeto:</b> Rechazar la comida o el vino se interpreta como desconfianza o falta de respeto.</div></li>
        </ul>
        <button class="ngBtn" id="ngGo" style="pointer-events:auto">Iniciar negociación →</button>
        <span class="ngK-hint">[ Presiona Iniciar o pulsa Enter / Espacio / → ]</span>
      </div>
    `),
    ngEl(`
      <div id="ngStage">
        <div id="ngDialogues">
          <div class="ngBubble" id="ngA">
            <i class="ngL" id="ngAL">ANDREI · RO</i>
            <p id="ngR"></p>
          </div>
          <div class="ngBubble" id="ngX">
            <i class="ngL" id="ngXL">TRADUCTOR · ES</i>
            <p id="ngE"></p>
            <div class="ngN">
              <span class="ngHintKeys">[ Usa ← / → o Espacio para traducir ]</span>
              <button id="ngBk" aria-label="Anterior">‹</button>
              <span id="ngC">1 / 3</span>
              <button id="ngFw" aria-label="Siguiente">›</button>
            </div>
          </div>
        </div>

        <div id="ngDeck">
          <div class="ngChar" id="ngTr">
            ${NG_TRA}
            <b>TRADUCTOR</b>
          </div>

          <div id="ngO">
            <div class="ngQ">¿QUÉ PRODUCTO COLOMBIANO LE OFRECES A ANDREI?</div>
            <div class="ngSub">(Selecciona una opción o presiona 1, 2, 3 o 4 en tu teclado)</div>
            <div class="ngG">
              ${NEG.map((n,i)=>`
                <button class="ngOpt" data-idx="${i}">
                  <span class="no-ic">${n.ic}</span>
                  <span class="no-tx">${n.t}</span>
                </button>
              `).join('')}
            </div>
          </div>

          <div class="ngChar" id="ngAn">
            ${NG_AND}
            <b>ANDREI</b>
          </div>
        </div>
      </div>
    `)
  );

  // Vincular eventos garantizados
  const goBtn=$('#ngGo');
  if(goBtn)goBtn.onclick=ngStart;
  
  const bkBtn=$('#ngBk');
  if(bkBtn)bkBtn.onclick=()=>ngStep(-1);
  
  const fwBtn=$('#ngFw');
  if(fwBtn)fwBtn.onclick=()=>ngStep(1);
  
  $$('.ngOpt').forEach((b,i)=>{
    b.onclick=()=>ngPick(i);
  });

  ngSt.mode='intro';
}

const scenes=[s1,s2,s3,sImp,s4,sHist,sPol,sWar,sODS,sEco,sFDI,sBallet,sNeg];
/* ============ NAVEGACIÓN ============ */
function ui(){const f=$('#pbf');f.style.width=((idx+1)/TOTAL*100)+'%';$('#prev').disabled=false;$('#next').disabled=idx>=scenes.length-1}
function goHome(){tok++;reset();idx=-1;started=false;off($('#scene'));$('#pb').classList.remove('show');$('#pbf').style.width='0';$('#prev').classList.remove('show');$('#next').classList.remove('show');$('#intro').classList.remove('out');$('#play').classList.remove('out');camTo(home(),1500).catch(()=>{})}
function go(i){if(i<0){if(idx===0)goHome();return}if(i>=scenes.length||i===idx)return;tok++;reset();idx=i;ui();scenes[i]().catch(e=>{if(e!==CANCEL)console.error(e)})}
$('#prev').onclick=()=>go(idx-1);$('#next').onclick=()=>go(idx+1);
addEventListener('keydown',e=>{if(!started)return;if(e.key=='ArrowRight'||e.key=='PageDown'||e.key==' '){e.preventDefault();go(idx+1)}else if(e.key=='ArrowLeft'||e.key=='PageUp'){e.preventDefault();go(idx-1)}});
const de=document.documentElement,rf=de.requestFullscreen||de.webkitRequestFullscreen,fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
if(!rf)$('#fs').style.display='none';
$('#fs').onclick=()=>{try{fsEl()?(document.exitFullscreen||document.webkitExitFullscreen).call(document):rf.call(de)}catch(e){}};
cam.cx=home().cx;cam.cy=home().cy;cam.h=home().h;render();
addEventListener('resize',()=>{if(!started)Object.assign(cam,home());else if(hold)Object.assign(cam,hold());if(relayout)relayout();render()});
$('#play').onclick=async()=>{started=true;$('#play').classList.add('out');$('#intro').classList.add('out');$('#pb').classList.add('show');on($('#scene'),$('#prev'),$('#next'));$('#prev').classList.add('show');$('#next').classList.add('show');await new Promise(r=>setTimeout(r,800));go(0)};
</script></body></html>
